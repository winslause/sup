<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unique check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .modal {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .modal-open {
            overflow: hidden;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        table {
            width: 100%;
            table-layout: auto;
        }
        th, td {
            min-width: 0;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            padding: 0.375rem 0.75rem;
        }
        th {
            white-space: nowrap;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-3 shadow-md fixed top-0 left-0 right-0 z-10">
        <div class="container mx-auto flex justify-between items-center max-w-full">
            <h1 class="text-lg font-bold"></h1>
            <div class="flex items-center space-x-2">
                <a href="/login" class="bg-green-500 hover:bg-green-600 px-3 py-1.5 rounded text-sm">Login</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-3 pt-16 w-full box-border max-w-full overflow-x-hidden">
        <!-- Suppression Form -->
        <div class="bg-white p-3 rounded-lg shadow-md mb-3 fade-in">
            <h2 class="text-base font-semibold mb-2">Check Your Data for Unique Phone Numbers</h2>
            <form id="checkForm" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-2">
                    <label class="block text-sm font-medium mb-1">Select Files (CSV/XLSX)</label>
                    <p class="text-xs text-gray-500 mb-1">Files must contain a phone column (e.g., 'phone', 'phone number', 'mobile', 'contact'). <a href="/static/sample_phone_file.xlsx" class="text-blue-500 hover:underline">Download sample file</a></p>
                    <input type="file" name="files" id="fileInput" multiple accept=".csv,.xlsx" required>
                    <button type="button" id="selectFilesBtn" class="bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded text-sm inline-flex items-center">
                        <i class="fas fa-upload mr-2"></i> Choose Files
                    </button>
                    <span id="fileNames" class="text-sm text-gray-600 ml-2"></span>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Check Files</button>
                </div>
            </form>
            <div id="loading" class="hidden mt-2">
                <div class="flex items-center">
                    <svg class="animate-spin h-5 w-5 mr-3 text-blue-500" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm">Processing...</span>
                </div>
            </div>
            <p id="checkStatus" class="mt-2 text-sm"></p>
        </div>

        <!-- Suppression Summary -->
        <div id="summarySection" class="bg-white p-3 rounded-lg shadow-md mb-3 fade-in hidden">
            <h2 class="text-base font-semibold mb-2">Suppression Summary</h2>
            <div id="summaryContent" class="text-sm"></div>
            <div id="downloadSection" class="mt-3"></div>
        </div>
    </main>

    <script>
        $(document).ready(function() {
            if (typeof $ === 'undefined') {
                console.error('jQuery not loaded');
                return;
            }

            // Trigger file input click when "Choose Files" button is clicked
            $('#selectFilesBtn').on('click', function() {
                $('#fileInput').click();
            });

            // Display selected file names
            $('#fileInput').on('change', function() {
                const files = this.files;
                const fileNames = Array.from(files).map(file => file.name).join(', ');
                $('#fileNames').text(fileNames || 'No files selected');
            });

            // Handle form submission
            $('#checkForm').on('submit', function(e) {
                e.preventDefault();
                if (!this.files.value) {
                    $('#checkStatus').text('Please select at least one file').addClass('text-red-600');
                    return;
                }
                $('#loading').removeClass('hidden');
                $('#checkStatus').text('').removeClass('text-red-600 text-green-600');
                $('#summarySection').addClass('hidden');
                $('#summaryContent').empty();
                $('#downloadSection').empty();

                const formData = new FormData(this);
                $.ajax({
                    url: '/check_suppression',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {'X-CSRF-Token': formData.get('csrf_token')},
                    success: function(response) {
                        $('#loading').addClass('hidden');
                        $('#checkStatus').text(response.message).addClass(response.status === 'success' ? 'text-green-600' : 'text-red-600');
                        $('#summarySection').removeClass('hidden');

                        // Prepare summary content
                        let summaryHtml = `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div><strong>Total Phones Checked:</strong> ${response.summary_metrics.total_checked}</div>
                                <div><strong>Total Unique Phones:</strong> ${response.summary_metrics.unique_after_merge}</div>
                            </div>
                            <h3 class="text-sm font-medium mt-3 mb-1.5">File Details</h3>
                            <div class="table-container">
                                <table class="w-full text-left text-sm">
                                    <thead>
                                        <tr class="bg-gray-200">
                                            <th class="p-1.5">File</th>
                                            <th class="p-1.5">Phones</th>
                                            <th class="p-1.5">Unique Phones</th>
                                            <th class="p-1.5">Duplicate Phones</th>
                                            <th class="p-1.5">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                        `;

                        response.metrics.forEach((m, i) => {
                            const status = m.error ? 'Error' : 'Processed';
                            const statusClass = m.error ? 'text-red-600' : 'text-green-600';
                            summaryHtml += `
                                <tr>
                                    <td class="p-1.5">${m.filename}</td>
                                    <td class="p-1.5">${m.phone_count}</td>
                                    <td class="p-1.5 text-green-600">${m.unique_count}</td>
                                    <td class="p-1.5 text-red-600">${m.duplicate_count}</td>
                                    <td class="p-1.5 ${statusClass}">${m.error || status}</td>
                                </tr>
                            `;
                        });

                        summaryHtml += `
                                    </tbody>
                                </table>
                            </div>
                        `;

                        $('#summaryContent').html(summaryHtml);

                        if (response.output_filename) {
                            $('#downloadSection').html(`
                                <a href="/download/${response.output_filename}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium inline-flex items-center">
                                    <i class="fas fa-download mr-2"></i> Download Unique Phones (${response.summary_metrics.unique_after_merge} numbers)
                                </a>
                            `);
                        } else {
                            $('#downloadSection').html(`
                                <p class="text-sm text-gray-600">No unique phones found to download.</p>
                            `);
                        }
                    },
                    error: function(xhr) {
                        $('#loading').addClass('hidden');
                        let errorMsg = 'Error processing files';
                        try {
                            const response = JSON.parse(xhr.responseText);
                            errorMsg = response.message || errorMsg;
                            $('#summarySection').removeClass('hidden');
                            let summaryHtml = `
                                <div class="text-red-600">${response.message}</div>
                                <h3 class="text-sm font-medium mt-3 mb-1.5">File Details</h3>
                                <div class="table-container">
                                    <table class="w-full text-left text-sm">
                                        <thead>
                                            <tr class="bg-gray-200">
                                                <th class="p-1.5">File</th>
                                                <th class="p-1.5">Phones</th>
                                                <th class="p-1.5">Unique Phones</th>
                                                <th class="p-1.5">Duplicate Phones</th>
                                                <th class="p-1.5">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                            `;
                            (response.metrics || []).forEach((m) => {
                                const status = m.error ? 'Error' : 'Processed';
                                const statusClass = m.error ? 'text-red-600' : 'text-green-600';
                                summaryHtml += `
                                    <tr>
                                        <td class="p-1.5">${m.filename}</td>
                                        <td class="p-1.5">${m.phone_count}</td>
                                        <td class="p-1.5 text-green-600">${m.unique_count}</td>
                                        <td class="p-1.5 text-red-600">${m.duplicate_count}</td>
                                        <td class="p-1.5 ${statusClass}">${m.error || status}</td>
                                    </tr>
                                `;
                            });
                            summaryHtml += `
                                        </tbody>
                                    </table>
                                </div>
                            `;
                            $('#summaryContent').html(summaryHtml);
                            $('#downloadSection').html(`
                                <p class="text-sm text-gray-600">No unique phones found to download.</p>
                            `);
                        } catch (e) {
                            console.error('Error parsing error response:', e);
                        }
                        $('#checkStatus').text(errorMsg).addClass('text-red-600');
                    }
                });
            });
        });
    </script>
</body>
</html>
