<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-semibold text-center mb-4">Login</h1>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-4">
                    {% for category, message in messages %}
                        <p class="text-sm p-2 rounded {{ 'text-green-600 bg-green-100' if category == 'success' else 'text-red-600 bg-red-100' }}">
                            {{ message }}
                        </p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium mb-1">Username</label>
                <input type="text" id="username" name="username" class="w-full p-2 border rounded text-sm" required>
            </div>
            <div class="mb-4 relative">
                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full p-2 border rounded text-sm pr-10" required>
                <span id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 mt-6 cursor-pointer">
                    <i class="fas fa-eye text-gray-500"></i>
                </span>
            </div>
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm">Login</button>
            </div>
        </form>
        
        <!-- Link to Check Files for Uniques -->
        <p class="mt-4 text-sm text-center">
            For other users: <a href="{{ url_for('check') }}" class="text-blue-500 hover:text-blue-600 underline">Check your files for uniques</a>
        </p>
        
        <p id="loginStatus" class="mt-4 text-sm text-red-600 hidden"></p>
    </div>

    <script>
        // Toggle password visibility
        $('#togglePassword').on('click', function() {
            const passwordField = $('#password');
            const icon = $(this).find('i');
            if (passwordField.attr('type') === 'password') {
                passwordField.attr('type', 'text');
                icon.removeClass('fa-eye').addClass('fa-eye-slash');
            } else {
                passwordField.attr('type', 'password');
                icon.removeClass('fa-eye-slash').addClass('fa-eye');
            }
        });

        // Handle form submission (optional, for AJAX if needed)
        $('#loginForm').on('submit', function(e) {
            // Commenting out AJAX to use default form submission
            /*
            e.preventDefault();
            const formData = new FormData(this);
            $.ajax({
                url: '/login',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                headers: {'X-CSRF-Token': formData.get('csrf_token')},
                success: function(response) {
                    window.location.href = response.redirect || '/';
                },
                error: function(xhr) {
                    $('#loginStatus').text(xhr.responseJSON?.message || 'Login failed').removeClass('hidden');
                }
            });
            */
        });
    </script>
</body>
</html>
